name: water_reminder
description: "Track daily water intake with reminders and streak systems."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.70.2

  # Ads
  google_mobile_ads: ^5.3.0

  # Utilities
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  android_alarm_manager_plus: ^5.0.0
  home_widget: ^0.6.0
  lottie: ^3.3.1
  percent_indicator: ^4.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
